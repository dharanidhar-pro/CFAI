<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <title>Google AI Studio App</title>
    <script>
      // Prevent fetch polyfill crashes in browsers where window.fetch is a getter only
      (function() {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return window._polyfilledFetch || originalFetch; },
          set: function(fn) { window._polyfilledFetch = fn; },
          configurable: true
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
